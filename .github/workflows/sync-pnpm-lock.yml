name: Sync pnpm lockfile

on:
  push:
    branches:
      - perf/startup-immersive-ota
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/sync-pnpm-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: perf/startup-immersive-ota

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Resolve package lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm lockfile"
          git push
